<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#818cf8" stroke-width="6" opacity="0.4" />
  
  <!-- Inner Shield / Emblem -->
  <path d="M256 100 L370 150 L370 270 C370 345 256 412 256 412 C256 412 142 345 142 270 L142 150 Z" 
        fill="#ffffff" fill-opacity="0.12" stroke="#a5b4fc" stroke-width="8" filter="url(#shadow)" />
        
  <!-- Graduation Cap & Smart Star Icon -->
  <path d="M256 160 L350 205 L256 250 L162 205 Z" fill="#ffffff" />
  <path d="M190 220 L190 270 C190 295 256 315 256 315 C256 315 322 295 322 270 L322 220" 
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <path d="M350 205 L350 280 L340 285 L340 205" fill="#f59e0b" />
  
  <!-- Center Star of Excellence -->
  <polygon points="256,225 264,242 283,243 268,255 273,273 256,262 239,273 244,255 229,243 248,242" fill="#fbbf24" />
  
  <!-- Persian Typography Symbol: داناتک -->
  <text x="256" y="375" font-family="Tahoma, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    داناتک
  </text>
</svg>
